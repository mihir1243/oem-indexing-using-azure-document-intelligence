[project]
name = "oem-manual-indexing-using-azure-intelligence"
version = "0.1.0"
description = "OEM manual extraction (Docling), chunking, embedding, and Azure AI Search retrieval pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # PDF pipeline only (no docx/pptx/xlsx/email/etc. from docling-slim[standard]).
    # OCR via system Tesseract (see DOCLING_OCR_ENGINE). Avoid feat-ocr-rapidocr in cloud (modelscope.cn).
    "docling-slim[format-pdf,convert-core,models-local]>=2.0.0",
    # Direct pins so uv resolves CPU wheels from pytorch-cpu (see tool.uv.sources).
    "torch>=2.2.2",
    "torchvision>=0.15.0",
    "azure-search-documents>=11.6.0",
    "openai>=1.30.0",
    "pydantic-settings>=2.0.0",
    "langchain-text-splitters>=0.2.0",
    "tiktoken>=0.7.0",
    "python-dotenv>=1.0.0",
    "tenacity>=8.0.0",
    "rich>=13.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "python-multipart>=0.0.12",
    # Docling table structure (docling_ibm_models) imports cv2; not pulled without rapidocr.
    "opencv-python-headless>=4.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: tests that require live Azure/OpenAI credentials",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# CPU-only PyTorch in Docker/Linux (default PyPI torch pulls multi-GB NVIDIA CUDA wheels).
[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
