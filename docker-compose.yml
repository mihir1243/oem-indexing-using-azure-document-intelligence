services:
  oem-manuals:
    build: .
    image: oem-manual-indexing:latest
    # Container resource limits (edit for your host / manual size)
    cpus: "4.0"
    mem_limit: 8g
    mem_reservation: 4g
    env_file:
      - .env
    environment:
      MARKDOWN_OUTPUT_DIR: /data/extracted/markdown
      HF_HOME: /data/.cache/huggingface
      XDG_CACHE_HOME: /data/.cache
    volumes:
      - ./pdfs:/data/pdfs:ro
      - ./extracted:/data/extracted
      - ./manifest.json:/data/manifest.json:ro
      - docling-cache:/data/.cache
    # Override command for your job, e.g.:
    # command: ["index", "--folder", "/data/pdfs", "--manifest", "/data/manifest.json"]
    command: ["help"]

volumes:
  docling-cache:
